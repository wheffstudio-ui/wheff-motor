name: Leitor de Documentos

# Roda a cada 10 minutos, como o motor de midia. Voce envia o arquivo pela
# plataforma e nao precisa entrar aqui.
#
# O Docling instala torch e baixa modelos de layout (~85s), e foi por isso
# que este workflow comecou de hora em hora. A solucao nao era esperar mais:
# e conferir a fila ANTES de instalar. Uma passagem sem trabalho custa
# segundos; so quando ha documento e que a instalacao acontece.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [doc-ingest]

concurrency:
  group: leitor-documentos
  cancel-in-progress: false

jobs:
  ler:
    runs-on: ubuntu-latest
    # PDF longo com muitas tabelas leva minutos. 45 da folga sem deixar um
    # travamento consumir hora de runner a toa.
    timeout-minutes: 45
    steps:
      # Porteiro: uma chamada HTTP, sem checkout e sem Python. E o que torna
      # a passagem de 10 em 10 minutos barata.
      - name: Ha documento esperando?
        id: fila
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          echo "inicio=$(date +%s)" >> "$GITHUB_OUTPUT"
          agora=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Fase 7: tarefa em espera entre tentativas não conta; travada com
          # reserva vencida conta (o claim_job a recupera).
          resposta=$(curl -sS \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/jobs?job_type=eq.doc.ingest&select=id&limit=1&or=(and(status.eq.QUEUED,available_at.lte.$agora),and(status.eq.RUNNING,lease_expires_at.lt.$agora))")
          # Resposta vazia da API é "[]". Qualquer id dentro significa trabalho.
          if echo "$resposta" | grep -q '"id"'; then
            echo "tem=1" >> "$GITHUB_OUTPUT"; echo "algum=1" >> "$GITHUB_OUTPUT"
            echo "ha documento na fila — seguindo para a leitura"
          else
            echo "tem=0" >> "$GITHUB_OUTPUT"; echo "algum=0" >> "$GITHUB_OUTPUT"
            echo "fila vazia — encerrando sem instalar nada"
          fi

      - uses: actions/checkout@v4
        if: steps.fila.outputs.tem == '1'

      - uses: actions/setup-python@v5
        if: steps.fila.outputs.tem == '1'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      # Os modelos de layout e de tabela do Docling sao baixados na primeira
      # execucao. Sem cache, seriam baixados de novo toda vez.
      - uses: actions/cache@v4
        if: steps.fila.outputs.tem == '1'
        with:
          path: |
            ~/.cache/docling
            ~/.cache/huggingface
          key: docling-modelos-v1

      - name: Instalar Docling
        if: steps.fila.outputs.tem == '1'
        run: pip install -q -r requirements-docs.txt

      - name: Ler documento da fila
        if: steps.fila.outputs.tem == '1'
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WHEFF_ORG: wheff
          WHEFF_BUCKET: documentos
        run: python docs_ingest.py

      # Mede o uso (Fase 7): cada passagem vira um registro no diário
      # (events, tipo motor.execucao) com a duração e se teve trabalho. A tela
      # Motor e fila da plataforma soma os minutos. Repositório público: os
      # minutos do GitHub Actions não são cobrados, mas ficam visíveis.
      - name: Registrar execução
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          inicio="${{ steps.fila.outputs.inicio }}"; dur=$(( $(date +%s) - ${inicio:-$(date +%s)} ))
          corpo=$(jq -nc --arg wf "docs" --arg st "${{ job.status }}" --arg run "${{ github.run_id }}" \
            --arg ev "${{ github.event_name }}" --argjson dur "$dur" --argjson tem "${{ steps.fila.outputs.algum || 1 }}" \
            '{org_id:"wheff", event_type:"motor.execucao", actor_type:"system", actor_id:"github-actions",
              payload:{workflow:$wf, duracao_s:$dur, teve_trabalho:($tem==1), resultado:$st, run_id:$run, gatilho:$ev}}')
          curl -sS -o /dev/null -w "registro: %{http_code}\n" -X POST "${SUPABASE_URL%/}/rest/v1/events" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" -d "$corpo" || true
