name: Motor Wheff

# Quando roda:
#  - a cada 10 min, pegando o que estiver na fila
#  - ou quando você clica em "Run workflow" aqui no GitHub
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [media-ingest]

concurrency:
  group: media-engine
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Desde nov/2025 o yt-dlp precisa de um interpretador JavaScript (Deno)
      # para resolver o desafio do YouTube; sem ele o download falha.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependencias
        # yt-dlp sempre na versao mais nova: o YouTube muda e versao antiga
        # para de baixar ate ser atualizada. [default] traz o yt-dlp-ejs.
        run: |
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default]"

      # Guarda o modelo do Whisper entre execucoes (evita baixar 140MB toda vez)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.local/share/argos-translate
          key: modelos-whisper-small-argos-v1

      - name: 1. Baixar e transcrever
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          WHEFF_ORG: wheff
          WHISPER_MODEL: small
        run: python media_ingest.py

      # Roda mesmo se o passo anterior nao achou nada na fila
      - name: 2. Estrategia de comunidade
        if: always()
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHEFF_ORG: wheff
        run: python community.py

      # O community.py enfileirava esta tarefa desde o comeco e ninguem a
      # consumia — ficava parada na fila para sempre.
      - name: 3. Manifesto da comunidade
        if: always()
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHEFF_ORG: wheff
        run: python community_manifesto.py

      # Coleta de comentario. Nao usa Groq: nao gasta token nenhum, so busca
      # e guarda. Marcar o que e dor ou objecao continua sendo trabalho de
      # pessoa, na tela de Fontes.
      - name: 4. Coletar pesquisa (YouTube / Reddit)
        if: always()
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: wheff-pesquisa/1.0
          WHEFF_ORG: wheff
        run: python research_collect.py

      # Classifica as conversas do direct e do WhatsApp, e transforma cada
      # uma em research_source com as frases exatas. E o que faz 100
      # conversas por dia virarem 5 para a dona olhar.
      - name: 5. Atendimento — classificar conversas
        if: always()
        # Sem a tabela de conversas (sql/atendimento.sql nao rodado), este passo
        # falha. Nao pode pintar o motor inteiro de vermelho nem esconder se a
        # analise de conteudo, que vem depois, deu certo.
        continue-on-error: true
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHEFF_ORG: wheff
        run: python atendimento.py

      - name: 6. Analisar o conteudo
        if: always()
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          WHEFF_ORG: wheff
        run: python dna_analyze.py
