name: Em Alta

# De hora em hora (no minuto 17), ou quando voce mandar. Busca os RSS do
# Google Trends e do Google Noticias que a tela Em Alta mostra e guarda em
# public.em_alta_cache. O Google bloqueia o Worker da Cloudflare; daqui passa.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: em-alta
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -q requests
      - name: Buscar e guardar
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python em_alta.py
