name: Backup do banco

# Todo dia as 5h da manha (horario de Brasilia), ou quando voce mandar.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Os segredos viram env AQUI, no nivel do job, de proposito: o GitHub nao
    # aceita o contexto `secrets` dentro do `if` de um passo — a expressao nao
    # compila e o workflow inteiro e rejeitado antes de qualquer job nascer.
    # Com env, o `if` passa a ser valido.
    env:
      BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -q requests

      - name: Exportar tabelas
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKUP_DIR: ${{ github.workspace }}/backup
        run: python backup.py

      # NAO existe mais "copia como artefato". Este repositorio e PUBLICO:
      # artefato de repo publico pode ser baixado por qualquer conta do GitHub.
      # Entre 04/09 e 15/09/2026 o banco inteiro ficou exposto assim, 12 vezes.
      # O backup agora vai SO para o repositorio privado. Sem ele configurado,
      # o workflow falha de proposito — falhar e melhor que expor.
      - name: Exigir repositorio privado
        if: env.BACKUP_REPO == '' || env.BACKUP_REPO_TOKEN == ''
        run: |
          echo "::error::Configure os segredos BACKUP_REPO e BACKUP_REPO_TOKEN. Sem repositorio privado, o backup nao e guardado em lugar nenhum."
          rm -rf backup
          exit 1

      - name: Enviar para o repositorio privado
        run: |
          set -e
          git clone --depth 1 \
            "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git" destino
          DIA=$(date -u +%Y-%m-%d)
          mkdir -p "destino/supabase/${DIA}"
          cp backup/*.json "destino/supabase/${DIA}/"
          mkdir -p destino/supabase/ultimo
          cp backup/*.json destino/supabase/ultimo/
          cd destino
          git config user.name  "wheff-motor"
          git config user.email "motor@wheff.local"
          git add -A
          git diff --staged --quiet || git commit -m "Backup do Supabase ${DIA}"
          git push
